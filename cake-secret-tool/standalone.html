r-spacing:2px;color:#a99e8d;margin:20px 0 0}.atelier-foot span{padding:0 12px}.recipe{padding:36px 36px 30px;display:flex;flex-direction:column}.steps{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:34px}.step-tab{font-size:11px;color:var(--muted);padding:0 0 17px;position:relative;min-width:42px}.step-tab span{display:block;font:italic 18px Georgia,serif;margin-bottom:8px}.step-tab.active{color:var(--red)}.step-tab.active:after{content:"";position:absolute;bottom:-1px;height:2px;background:var(--red);left:0;right:0}.step-content{flex:1;min-height:430px}.eyebrow{font:10px Georgia,serif;letter-spacing:2.2px;color:var(--red);margin:0 0 13px}.step-content h1{font:normal 34px/1.4 var(--serif);margin:0 0 12px;letter-spacing:1px}.intro{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 26px}.field-label{display:flex;justify-content:space-between;font-size:12px;margin:23px 0 13px}.field-label small{font-size:10px;color:var(--muted)}.shape-options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.shape-option{padding:12px 0 8px;border:1px solid transparent;transition:background .2s}.shape-option.selected{border-color:var(--red);background:#f0e7dd}.shape-option svg{display:block;width:36px;height:36px;margin:auto auto 9px;fill:#dcc29b;stroke:#987d5c;stroke-width:1}.shape-option small{font-size:11px}.flavors{display:flex;gap:8px}.flavor{border:1px solid var(--line);padding:11px 14px;font-size:12px;flex:1}.flavor.selected{border-color:var(--red);color:var(--red)}.palette{display:flex;justify-content:space-between;gap:8px}.swatch{padding:4px;border:1px solid transparent;flex:1;min-width:0}.swatch.selected{border-color:var(--red)}.swatch i{display:block;height:32px;background:var(--swatch);border:1px solid #0000000c}.swatch small{font-size:9px;color:var(--muted);display:block;margin-top:6px;white-space:nowrap}.tool-options{display:flex;gap:8px;margin:18px 0}.tool-option{flex:1;border:1px solid var(--line);padding:12p ;justify-content:space-between;padding:22px;color:var(--muted);font-size:10px;letter-spacing:1px}
dialog{border:1px solid var(--line);padding:0;background:var(--paper);color:var(--ink);max-height:94dvh;max-width:calc(100% - 28px)}dialog::backdrop{background:#2920199c;backdrop-filter:blur(6px)}#previewDialog{width:850px}.preview-layout{display:grid;grid-template-columns:1.04fr 1fr}.film-wrap{background:#eee5d6;position:relative;aspect-ratio:9/16;max-height:88dvh}.film-wrap canvas,.film-wrap video{display:block;width:100%;height:100%;object-fit:contain}.preview-controls{padding:25px 28px;display:flex;flex-direction:column;justify-content:center}.close-preview{align-self:flex-start;margin-bottom:32px}.preview-controls h2{font:32px var(--serif);margin:0 0 12px}.preview-description{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 24px}.preview-controls .secondary{margin-top:10px;width:100%}.fine-print{font-size:10px;color:var(--muted);line-height:1.8;margin-top:20px}.preview-controls progress{width:100%;accent-color:var(--red);margin-top:20px}#progressLabel{font-size:12px}#downloadActions{margin-top:12px}.reset-dialog{padding:30px;max-width:400px}.reset-dialog h2{font:24px var(--serif)}.reset-dialog p{font-size:13px;color:var(--muted)}.reset-dialog>div{display:flex;gap:10px;margin-top:25px}#toast{position:fixed;z-index:99;bottom:25px;left:50%;transform:translate(-50%,15px);background:var(--ink);color:var(--white);padding:12px 20px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){.masthead{height:77px;padding:0 20px}.wordmark svg{width:30px}.wordmark>span{font-size:22px}.wordmark small{font-size:8px}.masthead>.text-btn{font-size:11px}.workspace{display:flex;flex-direction:column;min-height:0}.atelier{border-right:0;padding:19px 20px 0}.stage-label{padding:0;font-size:10px}.canvas-wrap{max-width:420px;width:min(100%,45dvh);margin:-8px auto -18px}.stage-bottom{flex-direction:row;align-items:center;min-height:45px}.stage-bottom p{font-size:10px;max-width:64%}.history-tools{gap:8px;align-self:auto}.history-tools button{font-size:10px}.atelier-foot{display:none}.recipe{padding:15px 20px 22px}.steps{margin-bottom:22px}.step-tab{display:flex;align-items:center;gap:6px;padding:7px 0 13px}.step-tab span{font-size:14px;margin:0}.step-content{min-height:0}.eyebrow{font-size:9px;margin-bottom:7px}.step-content h1{font-size:26px;margin-bottom:8px}.intro{font-size:12px;margin-bottom:18px;line-height:1.7}.field-label{margin-top:17px}.shape-option{padding:8px 0}.shape-option svg{height:29px;margin-bottom:5px}.step-footer{margin-top:23px;padding-top:15px}.page-footer{padding:18px 20px;font-size:9px}.page-footer span:last-child{display:none}.toppings{grid-template-columns:repeat(6,1fr);gap:4px}.topping canvas{width:34px;height:34px}.topping small{font-size:9px}.topping{padding:6px 0}.preview-layout{display:flex;flex-direction:column}.film-wrap{height:49dvh;width:auto;align-self:center}.preview-controls{padding:15px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.close-preview{margin:0;padding:5px 0;grid-column:1/-1}.preview-controls>.eyebrow,.preview-controls>h2,.preview-description{display:none}.preview-controls>.secondary{margin:0}.preview-controls .fine-print{grid-column:1/-1;margin:0;font-size:9px}#exportProgress,#downloadActions{grid-column:1/-1;margin:0}#downloadActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}#downloadActions .secondary{margin:0}#previewDialog{width:390px;max-height:95dvh}textarea{min-height:100px}.finish-list{margin:16px 0}.finish-list li{padding:11px 0}.recipe-note{margin-bottom:0}}

<body>
  <header class="masthead">
    <a href="./" class="wordmark" aria-label="给你一块首页"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 17 22 7l13 10v17H5Z M5 17h30 M5 26h30 M22 7v10"/></svg><span>给你一块<small>CAKE, WITH LOVE.</small></span></a>
    <span class="header-note">一些心意，藏在奶油里。</span>
    <button id="resetBtn" class="text-btn">重新做一块 ↗</button>
  </header>
  <main class="workspace">
    <section class="atelier" aria-label="蛋糕制作画布">
      <div class="stage-label"><span>你的手作台</span><span id="draftStatus">从一块蛋糕胚开始</span></div>
      <div class="canvas-wrap"><canvas id="cakeCanvas" width="1080" height="1020" aria-label="蛋糕画布：选择工具后，按住画奶油或点击摆放装饰"></canvas></div>
      <div class="stage-bottom"><p id="stageHint">先挑一个喜欢的形状。</p><div class="history-tools"><button id="undoBtn" class="text-btn" disabled aria-label="撤销上一次编辑">↶ 撤销</button><button id="redoBtn" class="text-btn" disabled aria-label="恢复上一次编辑">↷ 恢复</button></div></div>
      <p class="atelier-foot">MADE BY YOU <span>·</span> ONE OF A KIND</p>
    </section>
    <section class="recipe" aria-label="分步制作">
      <nav id="stepNav" class="steps" aria-label="制作步骤"></nav>
      <div class="step-content" id="stepContent"></div>
      <div class="step-footer"><button id="prevBtn" class="text-btn">← 上一步</button><button id="nextBtn" class="primary">下一步 <span>→</span></button></div>
    </section>
  </main>
  <footer class="page-footer"><span>不必是生日，也值得一块蛋糕。</span><span>给你一块 / 手作工坊</span></footer>
  <dialog id="previewDialog" aria-label="蛋糕揭晓预览">
    <div class="preview-layout"><div class="film-wrap"><canvas id="filmCanvas" width="720" height="1280" aria-label="完整蛋糕、切开动画及隐藏留言预览"></canvas><video id="resultVideo" controls playsinline hidden aria-label="已生成的视频"></video></div>
      <div class="preview-controls"><button id="closePreview" class="text-btn close-preview">← 回去修改</button><p class="eyebrow">A LITTLE SURPRISE</p><h2>切开，才知道。</h2><p class="preview-description">完整的蛋糕、切开的瞬间，<br>还有只想对 TA 说的话。</p><button id="cutBtn" class="primary">切开看看 <span>↗</span></button><button id="exportBtn" class="secondary">导出小视频 ↓</button><div id="exportProgress" hidden><progress max="100" value="0"></progress><p id="progressLabel" role="status">正在制作视频…</p><button id="cancelExport" class="text-btn">取消生成</button></div><div id="downloadActions" hidden><a id="downloadLink" class="primary" download>保存视频 ↓</a><button id="shareBtn" class="secondary">发给朋友 ↗</button></div><p id="exportNote" class="fine-print">竖屏短片 · 完整蛋糕 → 切开 → 留言<br>视频只包含作品，不包含操作界面。</p></div></div>
  </dialog>
  <dialog id="resetDialog" class="reset-dialog"><h2>重新做一块？</h2><p>会清空这块蛋糕和留言。</p><div><button id="cancelReset" class="secondary">继续做这块</button><button id="confirmReset" class="primary">重新开始</button></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('cakeCanvas'), ctx = canvas.getContext('2d');
  const film = $('filmCanvas'), fc = film.getContext('2d');
  const KEY = 'cake-note-studio-v2';
  const COLORS = [['香草','#fff5df'],['草莓','#efb4bd'],['抹茶','#bdc7a3'],['芋泥','#c7bbd5'],['芒果','#edce87'],['可可','#96715f']];
  const FLAVORS = {vanilla:['原味','#e8bf85','#f6d7a7'], cocoa:['可可','#80543d','#b38360'], strawberry:['草莓','#d79d99','#efbfaf']};
  const SHAPES = {round:['圆形','M35 20a15 15 0 1 1-30 0a15 15 0 1 1 30 0'],heart:['爱心','M20 35C-9 16 9-2 20 12C31-2 49 16 20 35Z'],flower:['花朵','M20 8C27-3 39 6 32 16C45 20 36 36 27 30C24 43 9 39 11 28C-3 29 0 12 12 14C8 3 18 1 20 8Z'],cloud:['云朵','M8 30C-3 30 0 15 9 16C8 1 27 0 28 14C42 9 44 29 33 30Z'],square:['方形','M6 6H34V34H6Z']};
  const TOPPINGS = {strawberry:'草莓',blueberry:'蓝莓',cherry:'樱桃',flower:'小花',bow:'蝴蝶结',candle:'蜡烛'};
  const steps = ['蛋糕胚','奶油','装饰','藏句话','送给你'];
  const blank = () => ({version:2,shape:'round',flavor:'vanilla',coat:null,strokes:[],toppings:[],message:'',recipient:'',sender:'',step:0});
  let state = blank(), history=[], future=[], tool='pipe', cream=COLORS[0][1], topping='strawberry', size=29;
  let drawing=null, lastPoint=null, toastTimer, animation=0, exporting=false, cancelRequested=false, recording=null, exportFile=null, exportURL=null;
  let saved=false, saveTimer, textSnapshot=null;
  try {const raw=JSON.parse(localStorage.getItem(KEY));if(validDraft(raw)){state=raw;saved=true;}} catch (_) {}
  function validDraft(s){return s?.version===2 && s.shape in SHAPES && s.flavor in FLAVORS && Array.isArray(s.strokes) && s.strokes.length<=500 && s.strokes.every(v=>Array.isArray(v.points)&&v.points.length<=6000&&v.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))) && Array.isArray(s.toppings) && s.toppings.length<=400 && s.toppings.every(t=>t.kind in TOPPINGS&&Number.isFinite(t.x)&&Number.isFinite(t.y)) && typeof s.message==='string' && s.message.length<=160 && typeof s.sender==='string' && typeof s.recipient==='string' && Number.isInteger(s.step)&&s.step>=0&&s.step<=4;}
  const clone = v => JSON.parse(JSON.stringify(v));
  function remember(){flushText();history.push(clone(state));if(history.length>70)history.shift();future=[];}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('draftStatus').textContent='草稿已保存';}catch(_){$('draftStatus').textContent='当前浏览器无法保存草稿';}}
  function changed(redraw=true){saved=true;persist();syncHistory();if(redraw)draw();}
  function syncHistory(){$('undoBtn').disabled=!history.length&&!textSnapshot;$('redoBtn').disabled=!future.length;}
  function flushText(){if(!textSnapshot)return;if(JSON.stringify(textSnapshot)!==JSON.stringify(state)){history.push(textSnapshot);if(history.length>70)history.shift();future=[];}textSnapshot=null;clearTimeout(saveTimer);syncHistory();}
  function undo(){endDraw();flushText();if(!history.length)return;future.push(clone(state));state=history.pop();renderUI();changed();}
  function redo(){endDraw();flushText();if(!future.length)return;history.push(clone(state));state=future.pop();renderUI();changed();}
  function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3000);}
  function setStep(n){endDraw();flushText();state.step=Math.max(0,Math.min(4,n));if(state.step===1&&!['pipe','rosette'].includes(tool))tool='pipe';if(state.step===2&&!['place','move','erase'].includes(tool))tool='place';renderUI();persist();draw();}
  function heading(k,title,body){return `<p class="eyebrow">${k}</p><h1>${title}</h1><p class="intro">${body}</p>`;}
  function palette(){return `<div class="palette">${COLORS.map(([n,c])=>`<button class="swatch ${c===cream?'selected':''}" data-color="${c}" aria-label="${n}奶油" aria-pressed="${c===cream}" style="--swatch:${c}"><i></i><small>${n}</small></button>`).join('')}</div>`;}
  function renderUI(){
    $('stepNav').innerHTML=steps.map((n,i)=>`<button class="step-tab ${i===state.step?'active':''}" data-step="${i}" ${i===state.step?'aria-current="step"':''}><span>0${i+1}</span>${n}</button>`).join('');
    const panel=$('stepContent');
    if(state.step===0)panel.innerHTML=heading('01 / THE BEGINNING','先选一块蛋糕胚。','圆圆的，或是特别一点。<br>这块蛋糕，慢慢做成你的样子。')+`<div class="field-label">挑个形状</div><div class="shape-options">${Object.entries(SHAPES).map(([k,[n,p]])=>`<button class="shape-option ${k===state.shape?'selected':''}" data-shape="${k}" aria-label="${n}蛋糕胚" aria-pressed="${k===state.shape}"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="${p}"/></svg><small>${n}</small></button>`).join('')}</div><div class="field-label">蛋糕口味</div><div class="flavors">${Object.entries(FLAVORS).map(([k,[n]])=>`<button class="flavor ${k===state.flavor?'selected':''}" data-flavor="${k}">${n}</button>`).join('')}</div><p class="recipe-note">下一步，给它抹上奶油。<br>做错了也没关系，随时可以撤销。</p>`;
    if(state.step===1)panel.innerHTML=heading('02 / A LITTLE CREAM','给它一层温柔。','先铺满奶油，再亲手挤上花纹。<br>不必整齐，你做的就很好。')+`<div class="field-label">奶油颜色</div>${palette()}<div class="tool-options"><button class="tool-option ${tool==='pipe'?'selected':''}" data-tool="pipe">〰 挤奶油</button><button class="tool-option ${tool==='rosette'?'selected':''}" data-tool="rosette">✿ 挤奶油花</button></div><button class="secondary full-width" id="coatBtn">用这个颜色铺满奶油</button><label class="tool-line">粗细 <input id="brushSize" aria-label="奶油粗细" type="range" min="12" max="44" value="${size}"></label><p class="recipe-note">手指按住蛋糕拖动，就能留下奶油。<br>点一下，也能挤出一朵小奶油花。</p>`;
    if(state.step===2)panel.innerHTML=heading('03 / FINISHING TOUCHES','放一点小小的快乐。','选一颗水果，点在蛋糕上。<br>多放一点也可以。')+`<div class="toppings">${Object.entries(TOPPINGS).map(([k,n])=>`<button class="topping ${k===topping?'selected':''}" data-topping="${k}" aria-pressed="${k===topping}"><canvas width="96" height="96" data-icon="${k}" aria-hidden="true"></canvas><small>${n}</small></button>`).join('')}</div><div class="tool-options"><button class="tool-option ${tool==='move'?'selected':''}" data-tool="move">↔ 移动装饰</button><button class="tool-option ${tool==='erase'?'selected':''}" data-tool="erase">× 移除装饰</button></div><button class="secondary full-width" id="rimBtn">沿边缘挤一圈奶油花</button><p class="recipe-note">选中「移动装饰」后可以拖动摆好的配料。<br>每次摆放、移动和移除，都可以单独撤销。</p>`;

    if(t>=2&&t<3.75){const down=ease((t-2)/.75),out=ease((t-3.05)/.7);c.save();c.globalAlpha=1-out;c.translate(360,170+down*205);c.rotate(-.10);const blade=c.createLinearGradient(-12,0,22,0);blade.addColorStop(0,'#b6babc');blade.addColorStop(.55,'#f5f6f4');blade.addColorStop(1,'#a0a6a8');c.fillStyle=blade;c.beginPath();c.moveTo(-12,-100);c.lineTo(20,-100);c.lineTo(14,105);c.quadraticCurveTo(-12,84,-12,65);c.closePath();c.fill();c.fillStyle='#6d4a38';c.fillRect(-12,-174,31,76);ellipse(c,3,-159,2,2,'#c5b3a1');ellipse(c,3,-118,2,2,'#c5b3a1');c.restore();}
    if(reveal>0){c.save();c.globalAlpha=reveal;c.translate(0,(1-reveal)*65);const text=state.message.trim();let fs=32;c.font=`${fs}px "Songti SC","Noto Serif CJK SC",serif`;let lines=textLines(c,text,474);while(lines.length*fs*1.65>320&&fs>22){fs--;c.font=`${fs}px "Songti SC","Noto Serif CJK SC",serif`;lines=textLines(c,text,474);}const height=Math.max(256,lines.length*fs*1.65+130);const y=647;c.shadowColor='#67412613';c.shadowBlur=20;c.shadowOffsetY=10;c.fillStyle='#fffdf7';c.fillRect(85,y,550,height);c.shadowColor='transparent';c.fillStyle='#883c33';c.font='13px Georgia,serif';c.fillText('A NOTE INSIDE',360,y+42);c.fillStyle='#4c4035';c.font=`${fs}px "Songti SC","Noto Serif CJK SC",serif`;lines.forEach((line,i)=>c.fillText(line,360,y+92+i*fs*1.65));if(state.sender){c.font='18px "Songti SC","Noto Serif CJK SC",serif';c.fillStyle='#8b7062';c.fillText(`— ${state.sender}`,360,y+height-28);}c.restore();}
    else{c.save();c.globalAlpha=1-ease((t-2.4)/1);c.fillStyle='#8e7e6b';c.font='24px "Songti SC","Noto Serif CJK SC",serif';c.fillText('有句话，藏在里面。',360,747);c.font='15px Georgia,serif';c.fillText('a little sweetness, a little secret',360,790);c.restore();}
    c.fillStyle='#a49480';c.font='14px "Songti SC","Noto Serif CJK SC",serif';c.fillText('不必是生日，也值得被惦记。',360,1188);
  }
  function stopAnimation(){cancelAnimationFrame(animation);animation=0;}
  function play(){if(exporting)return;stopAnimation();$('resultVideo').pause();$('resultVideo').hidden=true;film.hidden=false;const start=performance.now();$('cutBtn').textContent='重新看一遍 ↻';const loop=now=>{const t=(now-start)/1000;drawFilm(t);if(t<duration())animation=requestAnimationFrame(loop);};animation=requestAnimationFrame(loop);}
  function clearExport(){if(exportURL)URL.revokeObjectURL(exportURL);exportURL=null;exportFile=null;$('resultVideo').pause();$('resultVideo').removeAttribute('src');$('resultVideo').load();$('resultVideo').hidden=true;film.hidden=false;$('downloadActions').hidden=true;}
  function openPreview(){endDraw();flushText();if(!state.message.trim()){setStep(3);toast('先藏一句话，再送给 TA 吧');$('message').focus();return;}stopAnimation();clearExport();drawFilm(0);$('cutBtn').textContent='切开看看 ↗';$('previewDialog').showModal();document.body.style.overflow='hidden';}
  $('cutBtn').onclick=play;
  $('closePreview').onclick=()=>{if(exporting)return;stopAnimation();$('previewDialog').close();};
  $('previewDialog').addEventListener('cancel',e=>{if(exporting)e.preventDefault();});
  $('previewDialog').addEventListener('close',()=>{stopAnimation();$('resultVideo').pause();document.body.style.overflow='';});
  function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  function saveImage(){const out=document.createElement('canvas');out.width=1080;out.height=1080;const c=out.getContext('2d');c.scale(1.5,1.5);c.fillStyle='#f7f3eb';c.fillRect(0,0,720,720);cakeScene(c);out.toBlob(b=>{if(b)download(b,'给你一块-完整蛋糕.png');},'image/png');}
  function recorderFormat(){if(!window.MediaRecorder||!film.captureStream)return null;for(const mime of ['video/mp4;codecs=avc1.42001f','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){if(MediaRecorder.isTypeSupported(mime))return mime;}return null;}
  function exportUI(busy){exporting=busy;for(const id of ['closePreview','cutBtn','exportBtn'])$(id).disabled=busy;$('exportProgress').hidden=!busy;}
  $('cancelExport').onclick=()=>{cancelRequested=true;if(recording?.state==='recording')recording.stop();};
  // Recording is cancelled on backgrounding to avoid silently exporting frozen frames.
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&exporting){cancelRequested=true;if(recording?.state==='recording')recording.stop();toast('生成已暂停，请保持页面在前台后重试');}});
  $('exportBtn').onclick=async()=>{
    if(exporting)return;const mime=recorderFormat();if(!mime){toast('这个浏览器暂不支持视频生成，请用 Safari 或 Chrome 打开');return;}
    stopAnimation();clearExport();drawFilm(0);exportUI(true);cancelRequested=false;
    $('progressLabel').textContent='正在准备视频…';$('exportProgress').querySelector('progress').value=0;
    let stream,watchdog;const chunks=[];
    try{
      stream=film.captureStream(30);recording=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});
      const done=new Promise((resolve,reject)=>{recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recording.onerror=e=>reject(e.error||new Error('录制失败'));recording.onstop=resolve;});
      recording.start(250);const start=performance.now(),length=duration();
      const loop=now=>{if(cancelRequested)return;const elapsed=(now-start)/1000;drawFilm(Math.min(elapsed,length));const pct=Math.min(99,Math.round(elapsed/length*100));$('exportProgress').querySelector('progress').value=pct;$('progressLabel').textContent=`正在生成 ${pct}% · 请保持页面打开`;if(elapsed<length)animation=requestAnimationFrame(loop);else if(recording.state==='recording')recording.stop();};animation=requestAnimationFrame(loop);
      watchdog=setTimeout(()=>{cancelRequested=true;if(recording?.state==='recording')recording.stop();},(length+12)*1000);
      await done;stopAnimation();if(cancelRequested){drawFilm(0);return;}
      const type=recording.mimeType.split(';')[0],ext=type.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type});if(blob.size<1000)throw new Error('视频没有成功生成');
      exportFile=new File([blob],`给你一块-藏在蛋糕里的话.${ext}`,{type});exportURL=URL.createObjectURL(exportFile);
      $('downloadLink').href=exportURL;$('downloadLink').download=exportFile.name;$('downloadLink').textContent=`保存视频 · ${ext.toUpperCase()} ↓`;$('downloadActions').hidden=false;
      $('resultVideo').src=exportURL;$('resultVideo').hidden=false;film.hidden=true;
      $('exportNote').textContent=`${Math.round(length)} 秒 · 720 × 1280 · ${ext.toUpperCase()} · ${(blob.size/1048576).toFixed(1)} MB。`+(ext==='webm'?'此浏览器生成 WebM；如需 MP4，请用支持 MP4 录制的浏览器打开。':'保存视频后就能发给朋友。');
      toast('小视频做好了，可以保存或发给朋友');
    }catch(e){toast('视频生成失败，请重试或换浏览器打开');console.error('Video export:',e);}finally{clearTimeout(watchdog);stopAnimation();stream?.getTracks().forEach(t=>t.stop());recording=null;exportUI(false);}
  };
  $('shareBtn').onclick=async()=>{if(!exportFile)return;if(navigator.canShare?.({files:[exportFile]})&&navigator.share){try{await navigator.share({files:[exportFile],title:'给你一块',text:'亲手做了一块蛋糕，里面还有一句话给你。'});}catch(e){if(e.name!=='AbortError')toast('暂时无法直接分享，请先保存视频再发送');}}else{download(exportFile,exportFile.name);toast('视频已开始下载，保存后可发给朋友');}};
  window.addEventListener('pagehide',()=>{flushText();persist();});
  renderUI();draw();if(saved)$('draftStatus').textContent='已接着上次的草稿';
})();
