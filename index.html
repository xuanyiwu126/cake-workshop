<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="亲手做一块蛋糕，把一句话或一张照片藏进去。">
  <title>蛋糕工坊</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wordmark" aria-label="蛋糕工坊"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 17 22 7l13 10v17H5Z M5 17h30 M5 26h30 M22 7v10"/></svg><span>蛋糕工坊</span></div>
    <span class="header-note">一些心意，藏在奶油里</span>
    <button id="cabinetBtn" class="cabinet-btn">蛋糕柜 <span id="cabinetCount">0</span></button>
    <button id="resetBtn" class="reset-btn" aria-label="重新做一块" title="重新做一块"><span>↻</span> 重新做一块</button>
  </header>
  <main class="workspace">
    <section class="atelier" aria-label="蛋糕制作画布">
      <div class="atelier-top"><button id="inspirationBtn" class="inspiration-btn">今日灵感 <span>✦</span></button><span id="stageCaption">甜蜜，由你亲手完成</span></div>
      <div id="canvasStage" class="canvas-stage"><div id="canvasWrap" class="canvas-wrap"><canvas id="cakeCanvas" width="1440" height="1360" aria-label="蛋糕画布：单指装饰，双指缩放；视角工具可调节远近"></canvas><button id="giftOpenBtn" class="gift-open" hidden>拆开这份甜蜜 <span>↗</span></button><div id="cutBubble" class="cut-bubble" hidden>沿虚线切开看看吧</div></div><div id="canvasTools" class="canvas-tools" aria-label="画布工具"></div></div>
      <div id="viewControls" class="view-controls" aria-label="蛋糕视角"><button id="zoomOut" aria-label="缩小蛋糕">−</button><label><span id="zoomLabel">100%</span><input id="zoomSlider" type="range" min="80" max="160" value="100" aria-label="蛋糕大小"></label><button id="zoomIn" aria-label="放大蛋糕">+</button><label class="angle-control">视角<input id="angleSlider" type="range" min="60" max="90" value="72" aria-label="从立体到俯视"></label><button id="resetView" class="text-btn">复位</button></div>
      <aside id="toolDrawer" class="tool-drawer" aria-label="蛋糕工具抽屉" aria-hidden="true"><div class="drawer-head"><b>工具抽屉</b><button id="drawerClose" aria-label="收起工具抽屉">↓</button></div><nav id="drawerTabs" class="drawer-tabs" aria-label="工具分类"></nav><div id="drawerContent" class="drawer-content"></div></aside>
      <div class="stage-bottom"><button id="drawerToggle" class="drawer-toggle" aria-expanded="false" aria-controls="toolDrawer">工具抽屉 <span>⌃</span></button><div class="history-tools"><button id="undoBtn" class="text-btn" disabled aria-label="撤销上一次编辑">↶ 撤销</button><button id="redoBtn" class="text-btn" disabled aria-label="恢复上一次编辑">↷ 恢复</button></div></div>
      <div id="drawerCoach" class="drawer-coach" role="status" hidden><span>形状、口味、奶油和装饰，都在这里</span><button id="dismissCoach">知道了</button></div>
    </section>
    <section class="recipe" aria-label="分步制作">
      <div class="step-content" id="stepContent"></div>
      <div class="step-footer"><button id="prevBtn" class="text-btn">← 上一步</button><button id="nextBtn" class="primary">下一步 <span>→</span></button></div>
    </section>
  </main>
  <dialog id="previewDialog" aria-label="导出蛋糕">
    <div class="preview-layout">
      <div class="share-wrap"><button id="closePreviewBtn" class="preview-close" aria-label="退出导出">×</button><canvas id="shareCanvas" width="1440" height="2560" aria-label="蛋糕礼物视频预览"></canvas><button id="replayPreviewBtn" class="replay-preview" aria-label="重新播放礼物视频" title="重新播放" hidden>↻</button></div>
      <div class="preview-controls"><h2>这份甜蜜，准备好了</h2><div id="exportProgress" class="export-progress" hidden><div class="export-progress-track" aria-hidden="true"><div id="exportProgressBar" class="export-progress-bar"></div></div><p id="exportProgressText">正在准备导出内容…</p></div><div id="shareActions"><button id="exportVideoBtn" class="primary" disabled>视频准备中…</button><button id="publishBtn" class="secondary" disabled>发布图片笔记 ↗</button></div></div>
    </div>
  </dialog>
  <dialog id="cabinetDialog" class="collection-dialog" aria-label="我的蛋糕柜"><div class="dialog-heading"><div><span class="eyebrow">SWEET COLLECTION</span><h2>我的蛋糕柜</h2></div><button id="closeCabinet" class="icon-btn" aria-label="关闭蛋糕柜">×</button></div><p class="fine-print">收藏在这台设备的当前浏览器中，清除网站数据后会丢失。</p><div id="collectionBadges" class="collection-badges"></div><p id="cabinetStatus" role="status"></p><button id="undoRemove" class="text-btn" hidden>撤销刚刚的移除</button><div id="cabinetGrid" class="cabinet-grid"></div></dialog>
  <dialog id="workDialog" class="work-dialog" aria-label="作品详情"><div class="dialog-heading"><h2 id="workDetailTitle"></h2><button id="closeWork" class="icon-btn" aria-label="关闭作品">×</button></div><div class="work-image-scroll"><img id="workImage" alt="完整蛋糕作品"></div><label class="detail-zoom">放大查看<input id="workZoom" type="range" min="100" max="240" value="100" aria-label="作品放大比例"></label><div class="work-actions"><button id="shareWork" class="primary">再次分享</button><button id="remixWork" class="secondary">做一款新变化</button><button id="removeWork" class="text-btn">移出蛋糕柜</button></div></dialog>
  <dialog id="inspirationDialog" class="collection-dialog" aria-label="创作灵感"><div class="dialog-heading"><div><span class="eyebrow">A LITTLE INSPIRATION</span><h2>今天，想做哪一种甜？</h2></div><button id="closeInspiration" class="icon-btn" aria-label="关闭灵感">×</button></div><p id="dailyPrompt" class="daily-prompt"></p><div id="themeGrid" class="theme-grid"></div><p class="fine-print">套用后还能自由改造；每一款都可以撤销。</p></dialog>
  <dialog id="resetDialog" class="reset-dialog"><h2 tabindex="-1" autofocus>重新做一块？</h2><p>会清空这块蛋糕和留言。</p><div><button id="cancelReset" class="text-btn">继续做这块</button><button id="confirmReset" class="primary">重新开始</button></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
