<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dceaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>云朵捏捏机</title>
<style>
:root{--ink:#34465b;--muted:#76879a;--accent:#f08d79}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:linear-gradient(180deg,#dceaf6 0%,#edf3f7 62%,#f7f5f0 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overscroll-behavior:none}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.9) .7px,transparent .7px);background-size:8px 8px}.app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));position:relative}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.help{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.6);color:var(--ink);font-weight:800}.stage{height:min(65dvh,610px);min-height:430px;position:relative;margin:4px 0 8px;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;top:17%;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);font-size:12px;color:#5d7085;white-space:nowrap;pointer-events:none;transition:.3s}.hint.hide{opacity:0;transform:translate(-50%,-8px)}.toolbar{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:9px}.btn{border:0;min-height:50px;border-radius:16px;padding:0 12px;font:inherit;font-weight:750}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.38}.secondary{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:0 7px 20px rgba(67,87,108,.08)}.primary{background:linear-gradient(135deg,#ee8874,#f3a183);color:#fff;box-shadow:0 10px 25px rgba(238,136,116,.28)}.sheet,.modal{position:fixed;inset:0;background:rgba(46,60,76,.22);z-index:20;display:none}.sheet.open,.modal.open{display:block}.panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);background:#fbfcfd;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(52,68,84,.16)}.panel h2{margin:0 0 6px;font-size:20px}.panel p{margin:0 0 14px;color:var(--muted);font-size:13px}.cards{display:grid;gap:10px}.card{border:1px solid #e7edf2;background:white;border-radius:18px;padding:15px 16px;text-align:left;color:var(--ink);font:inherit;display:flex;justify-content:space-between;align-items:center}.card strong{font-size:15px}.card small{color:#93a0ad}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.result{display:none;padding-top:18px}.result.active{display:block}.play.hide{display:none}.result-card{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:16px;box-shadow:0 18px 50px rgba(64,83,109,.14)}.result-head{display:flex;justify-content:space-between;color:#8695a6;font-size:11px;letter-spacing:.12em}.result canvas{height:auto;aspect-ratio:1/1;margin:6px 0;border-radius:22px}.place{font-size:12px;color:#8b99a8}.result h2{font-size:24px;margin:6px 0 8px}.result p{font-size:14px;line-height:1.7;color:#5d6d7e;margin:0}.result-actions{grid-template-columns:1fr 1.25fr;margin-top:12px}.tip{text-align:center;font-size:12px;color:#8997a7}.modal-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 36px),440px);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(50,65,80,.2)}.modal-box h2{margin:0 0 12px}.modal-box p{color:var(--muted);line-height:1.7;font-size:14px}.close{width:100%;margin-top:8px}@media(max-height:700px){.stage{height:57dvh;min-height:350px}.btn{min-height:46px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">云朵捏捏机</div><div class="sub">随手捏一朵云，看看它想变成什么。</div></div><button id="help" class="help">?</button></header>
<section id="play" class="play"><div id="stage" class="stage"><canvas id="cloud"></canvas><div id="hint" class="hint">☝︎ 用手指拉一拉、推一推这朵云</div></div><div class="toolbar"><button id="undo" class="btn secondary" disabled>撤回</button><button id="knead" class="btn secondary">再揉一下</button><button id="imagine" class="btn primary" disabled>好像有点像了</button></div></section>
<section id="result" class="result"><div class="result-card"><div class="result-head"><span>CLOUD SIGHTING</span><span id="no">#0000</span></div><canvas id="resultCanvas"></canvas><div id="place" class="place"></div><h2 id="title"></h2><p id="desc"></p></div><div class="toolbar result-actions"><button id="adjust" class="btn secondary">返回调整</button><button id="again" class="btn primary">再捏一朵</button></div><div class="tip">可以直接截图保存这朵云。</div></section>
</main>
<div id="sheet" class="sheet"><div class="panel"><h2>你觉得，它有点像什么？</h2><p>没有标准答案，选一个你第一眼想到的。</p><div id="cards" class="cards"></div><div class="sheet-actions"><button id="back" class="btn secondary">回去捏捏</button><button id="refresh" class="btn secondary">再想想（2）</button></div></div></div>
<div id="modal" class="modal"><div class="modal-box"><h2>怎么玩</h2><p>按住云朵边缘向外拉，可以让它长出去；往里推，可以压出凹陷；「再揉一下」会随机帮你揉出一点变化。捏到满意后，让它变成猫、面包或漂浮小岛。</p><button id="close" class="btn primary close">知道了</button></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('cloud'),ctx=canvas.getContext('2d'),stage=$('stage'),hint=$('hint'),undo=$('undo'),knead=$('knead'),imagine=$('imagine'),sheet=$('sheet'),cards=$('cards'),refresh=$('refresh'),play=$('play'),result=$('result'),rc=$('resultCanvas'),rctx=rc.getContext('2d');
let W=1,H=1,dpr=Math.min(devicePixelRatio||1,2),pts=[],history=[],drag=false,idx=-1,last=null,changed=false,refreshLeft=2,saved=null,raf=0,t=0;
const meta={cat:{name:'一只趴着的猫',hint:'圆、软、懒洋洋',title:'趴着的猫云',desc:['悄悄长出了两只耳朵。','看起来没有起床的打算。','它只是想在天上趴一会儿。']},bread:{name:'一块刚出炉的面包',hint:'扁、蓬松、暖乎乎',title:'面包云',desc:['正在假装一块面包。','刚出炉，还带着一点天空味。','它看起来很适合配一杯牛奶。']},island:{name:'一座漂浮的小岛',hint:'不规则、有高低起伏',title:'漂浮小岛云',desc:['准备漂去一个没有闹钟的地方。','岛上今天没有人赶时间。','它可能正在寻找一片更蓝的天空。']}};
const places=['早餐开始之前','星期日下午四点','一扇没关好的窗外','回家路上的第三个红灯','刚刚醒来的天空','没有人赶时间的地方'];
function fit(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!pts.length)reset()}
function reset(){pts=[];const cx=W*.5,cy=H*.5,rx=Math.min(W*.31,145),ry=Math.min(H*.16,92),n=18;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,w=1+Math.sin(a*3+.4)*.07+Math.cos(a*5)*.025;pts.push({x:cx+Math.cos(a)*rx*w,y:cy+Math.sin(a)*ry*w})}history=[];changed=false;refreshLeft=2;update();hint.classList.remove('hide')}
const clone=(a=pts)=>a.map(p=>({x:p.x,y:p.y}));
function path(c,a,off=0){c.beginPath();const n=a.length,p0=a[0];c.moveTo((a[n-1].x+p0.x)/2,(a[n-1].y+p0.y)/2+off);for(let i=0;i<n;i++){const p=a[i],q=a[(i+1)%n];c.quadraticCurveTo(p.x,p.y+off,(p.x+q.x)/2,(p.y+q.y)/2+off)}c.closePath()}
function draw(){ctx.clearRect(0,0,W,H);const off=Math.sin(t)*2.2;t+=.025;const g=ctx.createLinearGradient(0,H*.3,0,H*.7);g.addColorStop(0,'#fff');g.addColorStop(1,'#e9f1f7');ctx.save();ctx.shadowColor='rgba(82,108,136,.22)';ctx.shadowBlur=30;ctx.shadowOffsetY=14;path(ctx,pts,off);ctx.fillStyle=g;ctx.fill();ctx.restore();path(ctx,pts,off);ctx.strokeStyle='rgba(103,132,159,.24)';ctx.lineWidth=2;ctx.stroke();raf=requestAnimationFrame(draw)}
function pos(clientX,clientY){const r=canvas.getBoundingClientRect();return{x:clientX-r.left,y:clientY-r.top}}
function nearest(p){let bi=-1,bd=1e9;pts.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;bi=i}});return bd<88?bi:-1}
function center(){return pts.reduce((a,p)=>({x:a.x+p.x/pts.length,y:a.y+p.y/pts.length}),{x:0,y:0})}
function smooth(s=.08){const a=clone(),n=pts.length;for(let i=0;i<n;i++){const p=a[(i-1+n)%n],c=a[i],q=a[(i+1)%n];pts[i].x=c.x*(1-s)+(p.x+q.x)*.5*s;pts[i].y=c.y*(1-s)+(p.y+q.y)*.5*s}}
function deform(i,dx,dy){const n=pts.length,c=center(),weights=[.18,.5,1,.5,.18];for(let k=-2;k<=2;k++){const j=(i+k+n)%n,w=weights[k+2];pts[j].x+=dx*w;pts[j].y+=dy*w;pts[j].x=Math.max(20,Math.min(W-20,pts[j].x));pts[j].y=Math.max(38,Math.min(H-35,pts[j].y));const vx=pts[j].x-c.x,vy=pts[j].y-c.y,r=Math.hypot(vx,vy),max=Math.min(W,H)*.43;if(r>max){pts[j].x=c.x+vx/r*max;pts[j].y=c.y+vy/r*max}}smooth(.06)}
function begin(p){idx=nearest(p);if(idx<0)return false;history.push(clone());if(history.length>10)history.shift();drag=true;last=p;hint.classList.add('hide');update();return true}
function move(p){if(!drag)return;deform(idx,p.x-last.x,p.y-last.y);last=p;changed=true;update()}
function end(){if(!drag)return;drag=false;idx=-1;smooth(.04)}
if('PointerEvent'in window){canvas.addEventListener('pointerdown',e=>{if(begin(pos(e.clientX,e.clientY))){if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);e.preventDefault()}});canvas.addEventListener('pointermove',e=>{if(drag){move(pos(e.clientX,e.clientY));e.preventDefault()}},{passive:false});canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}else{canvas.addEventListener('touchstart',e=>{const x=e.touches[0];if(x&&begin(pos(x.clientX,x.clientY)))e.preventDefault()},{passive:false});canvas.addEventListener('touchmove',e=>{const x=e.touches[0];if(x&&drag){move(pos(x.clientX,x.clientY));e.preventDefault()}},{passive:false});canvas.addEventListener('touchend',end);canvas.addEventListener('touchcancel',end)}
function update(){undo.disabled=!history.length;imagine.disabled=!changed}
undo.onclick=()=>{const a=history.pop();if(a){pts=a;changed=history.length>0;update()}};
knead.onclick=()=>{history.push(clone());if(history.length>10)history.shift();const c=center();for(let n=0;n<3;n++){const i=Math.floor(Math.random()*pts.length),p=pts[i],vx=p.x-c.x,vy=p.y-c.y,r=Math.max(1,Math.hypot(vx,vy)),a=10+Math.random()*16;p.x+=vx/r*a*(Math.random()>.35?1:-.5);p.y+=vy/r*a*(Math.random()>.35?1:-.5)}smooth(.12);changed=true;hint.classList.add('hide');update()};
function rank(){const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),ratio=(Math.max(...xs)-Math.min(...xs))/(Math.max(...ys)-Math.min(...ys));return ratio>1.75?['bread','cat','island']:ratio<1.3?['island','cat','bread']:['cat','island','bread']}
function show(){cards.innerHTML='';rank().forEach(id=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<strong>${meta[id].name}</strong><small>${meta[id].hint} →</small>`;b.onclick=()=>choose(id);cards.appendChild(b)});sheet.classList.add('open')}
imagine.onclick=show;$('back').onclick=()=>sheet.classList.remove('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};refresh.onclick=()=>{if(refreshLeft>0){refreshLeft--;refresh.textContent=refreshLeft?`再想想（${refreshLeft}）`:'就从这三个里选';if(!refreshLeft)refresh.disabled=true;show()}};
function bounds(a){const xs=a.map(p=>p.x),ys=a.map(p=>p.y);return{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)}}
function normalized(a,w,h){const b=bounds(a),bw=b.maxX-b.minX,bh=b.maxY-b.minY,s=Math.min(w*.62/bw,h*.62/bh),ox=(w-bw*s)/2-b.minX*s,oy=(h-bh*s)/2-b.minY*s;return a.map(p=>({x:p.x*s+ox,y:p.y*s+oy}))}
function choose(id){saved=clone();sheet.classList.remove('open');render(id);play.classList.add('hide');result.classList.add('active')}
function render(id){const size=Math.min(900,Math.max(560,innerWidth*2));rc.width=rc.height=size;const p=normalized(pts,size,size),b=bounds(p),bw=b.maxX-b.minX,bh=b.maxY-b.minY,cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2,seed=Math.floor(Math.random()*9000)+1000,m=meta[id];const bg=rctx.createLinearGradient(0,0,0,size);bg.addColorStop(0,id==='bread'?'#f5dfcb':'#cfe4f4');bg.addColorStop(1,'#f6f7f5');rctx.fillStyle=bg;rctx.fillRect(0,0,size,size);rctx.save();rctx.shadowColor='rgba(60,78,98,.15)';rctx.shadowBlur=24;rctx.shadowOffsetY=12;path(rctx,p);rctx.fillStyle=id==='bread'?'#f5d5aa':'#fffdf8';rctx.fill();rctx.restore();rctx.strokeStyle='#596778';rctx.lineWidth=size*.007;rctx.lineCap='round';rctx.lineJoin='round';if(id==='cat'){rctx.beginPath();rctx.moveTo(cx-bw*.22,b.minY+bh*.13);rctx.lineTo(cx-bw*.14,b.minY-bh*.03);rctx.lineTo(cx-bw*.06,b.minY+bh*.14);rctx.moveTo(cx+bw*.06,b.minY+bh*.14);rctx.lineTo(cx+bw*.14,b.minY-bh*.03);rctx.lineTo(cx+bw*.22,b.minY+bh*.13);rctx.stroke();rctx.beginPath();rctx.arc(cx-bw*.13,cy,bw*.055,.15*Math.PI,.85*Math.PI);rctx.arc(cx+bw*.13,cy,bw*.055,.15*Math.PI,.85*Math.PI);rctx.stroke();rctx.beginPath();rctx.moveTo(b.maxX-bw*.05,cy+bh*.12);rctx.bezierCurveTo(b.maxX+bw*.2,cy+bh*.1,b.maxX+bw*.2,cy-bh*.18,b.maxX+bw*.05,cy-bh*.18);rctx.stroke()}if(id==='bread'){rctx.strokeStyle='#af7953';for(let i=-1;i<=1;i++){rctx.beginPath();rctx.moveTo(cx+i*bw*.16-bw*.05,b.minY+bh*.27);rctx.quadraticCurveTo(cx+i*bw*.16,cy-bh*.14,cx+i*bw*.16+bw*.05,cy-bh*.04);rctx.stroke()}}if(id==='island'){rctx.strokeStyle='#66806b';rctx.beginPath();rctx.moveTo(b.minX+bw*.15,b.minY+bh*.1);rctx.quadraticCurveTo(cx,b.minY-bh*.06,b.maxX-bw*.13,b.minY+bh*.12);rctx.stroke();[-.16,.02,.2].forEach(dx=>{const x=cx+bw*dx,y=b.minY+bh*.06;rctx.beginPath();rctx.moveTo(x,y+bh*.16);rctx.lineTo(x,y);rctx.stroke();rctx.fillStyle='#78907d';rctx.beginPath();rctx.arc(x,y-bh*.02,bw*.055,0,Math.PI*2);rctx.fill()})}$('no').textContent='#'+seed;$('place').textContent='目击地点：'+places[seed%places.length];$('title').textContent=m.title;$('desc').textContent=m.desc[seed%m.desc.length]}
$('adjust').onclick=()=>{if(saved)pts=clone(saved);result.classList.remove('active');play.classList.remove('hide')};$('again').onclick=()=>{result.classList.remove('active');play.classList.remove('hide');reset()};$('help').onclick=()=>$('modal').classList.add('open');$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,100)});fit();draw();
})();
</script>
</body>
</html>
